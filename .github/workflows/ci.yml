name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref so new pushes don't pile up behind the
# slow Windows/macOS from-source LLVM builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

