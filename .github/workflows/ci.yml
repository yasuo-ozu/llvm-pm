  test:
    name: Test / ${{ matrix.platform.label }} / LLVM ${{ matrix.llvm }}
    runs-on: ${{ matrix.platform.runs-on }}
    #needs: pre-check
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: Linux
            runs-on: ubuntu-latest
            rust-toolchain: stable
          - label: Windows (MSVC)
            runs-on: windows-latest
            rust-toolchain: stable-msvc
          - label: macOS (macos-latest)
            runs-on: macos-latest
            rust-toolchain: stable
          - label: macOS (macos-15-intel)
            runs-on: macos-15-intel
            rust-toolchain: stable
        llvm:
          - "10.0.1"
          - "11.0.1"
          - "12.0.1"
          - "13.0.1"
          - "14.0.6"
          - "15.0.7"
          - "16.0.6"
          - "17.0.6"
          - "18.1.8"
          - "19.1.7"
          - "20.1.8"
          - "21.1.4"
          - "22.1.0"
        exclude:
          # LLVM 10 (released 2020) is incompatible with the current macOS runner
          # images: its libclang cannot target arm64 (Apple Silicon → bindgen
          # pointer-width assertion) and cannot parse the macOS 15 SDK headers
          # (_Float16 is unsupported). The combination cannot build regardless of
          # configuration, so macOS + LLVM 10 is omitted on both arches.
          - platform:
              label: macOS (macos-latest)
              runs-on: macos-latest
              rust-toolchain: stable
            llvm: "10.0.1"
          - platform:
              label: macOS (macos-15-intel)
              runs-on: macos-15-intel
              rust-toolchain: stable
            llvm: "10.0.1"
    steps:
      - uses: actions/checkout@v4

      # Windows: activate MSVC and remove Git Bash's GNU link.exe, which otherwise
      # shadows MSVC's linker (Git Bash lists /usr/bin ahead of the MSVC PATH) and
      # breaks rustc's msvc target with "/usr/bin/link: extra operand". The
      # llvm-full install action does not set up MSVC, so do it here.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Remove GNU link.exe shadowing MSVC linker (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f "/c/Program Files/Git/usr/bin/link.exe" "/usr/bin/link.exe" "/usr/bin/link" 2>/dev/null || true

      # Install prebuilt LLVM via the llvm-full action (download + env setup,
      # including macOS DYLD_FALLBACK_LIBRARY_PATH for bundled libunwind, libtinfo5
      # for old Linux, and LLVM_SYS_<key>_PREFIX / LLVM_CONFIG / LIBCLANG_PATH).
      - name: Install LLVM ${{ matrix.llvm }}
        uses: yasuo-ozu/llvm-full@main
        with:
          version: ${{ matrix.llvm }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.platform.rust-toolchain }}

      - name: Resolve LLVM features
        shell: bash
        run: |
          LLVM_TAG="${{ matrix.llvm }}"
          LLVM_MAJOR="${LLVM_TAG%%.*}"
          LLVM_MINOR="$(echo "$LLVM_TAG" | cut -d. -f2)"
          # `llvm-plugin-crate` is intentionally NOT exercised in CI: llvm-plugin
          # links LLVM dynamically (`rustc-link-lib=dylib=LLVM` / `LLVM-C`), but the
          # prebuilt LLVM from llvm-full ships static core libraries only (no
          # libLLVM.so/.dylib), so it cannot link there. The feature still builds for
          # users whose LLVM provides a shared library.
          echo "LLVM_FEATURES=llvm${LLVM_MAJOR}-${LLVM_MINOR}" >> "$GITHUB_ENV"

      # Cache only the downloaded crate registry (small, shared), NOT ~/.cargo/git
      # or target/. The whole repo shares a 10 GB Actions cache budget; the
      # expensive artifact to preserve is the from-source LLVM build (Windows /
      # old LLVM, ~40 min each), so keep cargo's footprint minimal to leave room
      # for the LLVM caches in install-llvm. Crate deps recompile in minutes.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ runner.os }}-${{ matrix.platform.runs-on }}-cargoreg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform.runs-on }}-cargoreg-

      - name: Build
        shell: bash
        run: cargo build --workspace --no-default-features --features $LLVM_FEATURES --verbose

      - name: Test
        shell: bash
        run: cargo test --workspace --no-default-features --features $LLVM_FEATURES --verbose

      - name: Run example
        shell: bash
        # LLVM 10 on Windows MSVC crashes in LLVM's MCJIT teardown at process exit
        # (non-deterministic 0xc0000374 / 0xc0000005) AFTER the example prints its
        # correct result. This is an upstream LLVM-10 JIT issue on the v142/UCRT
        # runtime (LLVM 11+ are fine with the identical build) and does not occur in
        # the non-JIT test suite, so skip just the example for that one cell.
        if: ${{ !(matrix.platform.label == 'Windows (MSVC)' && matrix.llvm == '10.0.1') }}
        run: cargo run --example all_pass_kinds --no-default-features --features $LLVM_FEATURES --verbose

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        uses: yasuo-ozu/llvm-full@main
        with:
          version: "18.1.8"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-latest-cargo-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        # LLVM 18 uses inkwell 0.9; `llvm-plugin-crate` is unsupported there
        # (compile_error), so coverage runs the core feature only.
        run: cargo tarpaulin --workspace --no-default-features --features llvm18-1 --out xml --output-dir coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cobertura.xml
          fail_ci_if_error: false
