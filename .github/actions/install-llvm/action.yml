name: install-llvm
description: "Install prebuilt LLVM from the yasuo-ozu/llvm-full release archive"

inputs:
  version:
    description: "Full LLVM version, e.g. 18.1.8"
    required: true

runs:
  # Uses prebuilt LLVM (with static libs, headers, llvm-config and libclang) from
  # https://github.com/yasuo-ozu/llvm-full, which publishes every LLVM 10..22 for
  # Linux/macOS/Windows. This replaces apt / Homebrew / from-source builds and is
  # the only source that provides, uniformly: old LLVM on Apple Silicon, MSVC libs
  # for Windows, and LLVM 22 with complete headers.
  using: composite
  steps:
    # MSVC toolchain for the rustc msvc target's link step (LLVM itself is prebuilt,
    # so no cmake/Ninja is needed — but the crate still links via link.exe).
    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # `shell: bash` is Git Bash, whose PATH lists /usr/bin ahead of the Windows PATH
    # that msvc-dev-cmd extends, so Git's GNU link.exe shadows MSVC's linker and
    # rustc fails with "/usr/bin/link: extra operand ...". Remove the GNU link tools.
    - name: Remove GNU link.exe shadowing MSVC linker (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        rm -f "/c/Program Files/Git/usr/bin/link.exe" "/usr/bin/link.exe" "/usr/bin/link" 2>/dev/null || true

    - name: Install prebuilt LLVM ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        MAJOR="${VERSION%%.*}"
        MINOR="$(echo "$VERSION" | cut -d. -f2)"
        # llvm-sys env-var key: LLVM 10..17 -> "<MAJOR>0" (llvm-sys 100..170);
        # LLVM 18+ -> "<MAJOR><MINOR>" (181/191/201/211/221).
        if [ "$MAJOR" -le 17 ]; then KEY="${MAJOR}0"; else KEY="${MAJOR}${MINOR}"; fi

        arch="$(uname -m)"
        case "${RUNNER_OS}" in
          Linux)
            asset="llvm-${VERSION}-linux-x86_64.tar.xz"; kind="tar" ;;
          macOS)
            case "$arch" in
              arm64|aarch64) asset="llvm-${VERSION}-macos-aarch64.tar.xz" ;;
              *)             asset="llvm-${VERSION}-macos-x86_64.tar.xz" ;;
            esac
            kind="tar" ;;
          Windows)
            asset="llvm-${VERSION}-windows-msvc.zip"; kind="zip" ;;
          *) echo "unsupported runner OS: ${RUNNER_OS}" >&2; exit 1 ;;
        esac

        url="https://github.com/yasuo-ozu/llvm-full/releases/download/v${VERSION}/${asset}"
        archive="${RUNNER_TEMP}/${asset}"
        prefix_u="${RUNNER_TEMP}/llvm-${VERSION}"   # unix-style path for tooling here
        rm -rf "$prefix_u"; mkdir -p "$prefix_u"

        echo "Downloading $url"
        curl -fSL --retry 5 --retry-delay 5 --retry-connrefused "$url" -o "$archive"

        if [ "$kind" = "zip" ]; then
          # 7-Zip is preinstalled on the Windows runners and handles large zips fast.
          7z x -y -o"$prefix_u" "$archive" >/dev/null
        else
          tar -xf "$archive" -C "$prefix_u"
        fi

        # The archives extract bin/ include/ lib/ directly; tolerate a single wrapper
        # directory just in case by locating llvm-config under the prefix.
        cfg="$(find "$prefix_u" -maxdepth 3 -type f \( -name 'llvm-config' -o -name 'llvm-config.exe' \) | head -n1)"
        if [ -z "$cfg" ]; then
          echo "llvm-config not found under $prefix_u" >&2
          find "$prefix_u" -maxdepth 2 -type d >&2 || true
          exit 1
        fi
        root_u="$(dirname "$(dirname "$cfg")")"   # .../<root>/bin/llvm-config -> <root>

        if [ "${RUNNER_OS}" = "Windows" ]; then
          root_w="$(cygpath -w "$root_u")"
          echo "LLVM_PREFIX=${root_w}"            >> "$GITHUB_ENV"
          echo "LLVM_DIR=${root_w}"               >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=${root_w}\\bin\\llvm-config.exe" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=${root_w}\\bin"     >> "$GITHUB_ENV"   # libclang.dll lives in bin
          echo "LLVM_SYS_${KEY}_PREFIX=${root_w}" >> "$GITHUB_ENV"
          echo "${root_w}\\bin"                   >> "$GITHUB_PATH"
        else
          echo "LLVM_PREFIX=${root_u}"            >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=${root_u}/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=${root_u}/lib"      >> "$GITHUB_ENV"   # libclang.so/.dylib in lib
          echo "LLVM_SYS_${KEY}_PREFIX=${root_u}" >> "$GITHUB_ENV"
          echo "${root_u}/bin"                    >> "$GITHUB_PATH"
        fi
        echo "LLVM_MAJOR=${MAJOR}" >> "$GITHUB_ENV"

        chmod +x "$cfg" 2>/dev/null || true
        echo "Installed LLVM $("$cfg" --version) at ${root_u}"

    - name: Verify LLVM toolchain
      shell: bash
      run: |
        set -euo pipefail
        "${LLVM_CONFIG}" --version
        inc="$("${LLVM_CONFIG}" --includedir)"
        for h in "llvm-c/Types.h" "llvm-c/TargetMachine.h" "llvm/Passes/PassPlugin.h"; do
          if [ ! -f "${inc}/${h}" ]; then
            echo "Missing required LLVM header: ${inc}/${h}" >&2
            exit 1
          fi
        done
        echo "LLVM headers OK under ${inc}"
